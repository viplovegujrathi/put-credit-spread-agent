<!doctype html><html lang="en"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
background:#0b0e13;color:#e9edf3;-webkit-font-smoothing:antialiased;
font:14px/1.6 ui-sans-serif,-apple-system,"SF Pro Text",Segoe UI,Inter,sans-serif;
background-image:radial-gradient(760px 420px at 50% -10%,rgba(88,166,255,.14),transparent),
radial-gradient(560px 320px at 85% 108%,rgba(63,185,80,.08),transparent)}
.card{width:100%;max-width:400px;text-align:center;background:#141922;
border:1px solid #242c38;border-radius:16px;padding:38px 30px 32px;
box-shadow:0 18px 50px rgba(0,0,0,.45)}
svg{width:56px;height:56px;border-radius:14px;margin-bottom:20px;
box-shadow:0 4px 20px rgba(47,127,224,.38),0 0 0 1px rgba(255,255,255,.07)}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em}
.tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8792a4;
font-weight:600;margin-bottom:22px}
p{color:#a4aec0;font-size:13.5px;margin:0 0 20px}
a.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:13.5px;
padding:10px 22px;border-radius:9px;color:#fff;
background:linear-gradient(180deg,#4b9bf5,#2f7fe0);border:1px solid #2f7fe0;
box-shadow:0 2px 10px rgba(47,127,224,.3)}
a.btn:hover{filter:brightness(1.08)}
.foot{margin-top:24px;padding-top:18px;border-top:1px solid #242c38;
color:#6b7688;font-size:11.5px;line-height:1.6}
</style></head><body>
<div class="card">
<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
<rect width="32" height="32" rx="8.5" fill="url(#lg)"/>
<path d="M5.5 8.5 L12 15 L16.5 11 L26.5 21" stroke="#fff" stroke-width="2.3"
 stroke-linecap="round" stroke-linejoin="round"/>
<path d="M5.5 25.2 H26.5" stroke="#fff" stroke-opacity=".62" stroke-width="2.6"
 stroke-linecap="round"/>
<defs><linearGradient id="lg" x1="0" y1="0" x2="30" y2="32" gradientUnits="userSpaceOnUse">
<stop stop-color="#4b9bf5"/><stop offset="1" stop-color="#2ea55c"/></linearGradient></defs>
</svg>
<h1>Put Credit Spread Agent</h1>
<div class="tag">S&amp;P 500 &middot; beaten-down &middot; defined risk</div>
<p>This dashboard is private. Sign in with the credentials for this account to
continue.</p>
<a class="btn" href="/">Sign in</a>
<!-- Deliberately says nothing about the account: not the balance, not the
     position count, not whether the agent traded today. An unauthenticated
     page is served to anyone who finds the hostname. -->
<div class="foot">Paper trading only. No broker credentials are held on this
server.</div>
</div></body></html>
