# Temporary. Enabled only long enough for certbot to answer the HTTP-01
# challenge, then replaced by nginx-pcs.conf once the certificate exists.
#
# It exists because `certbot --nginx` EDITS nginx configuration to prove the
# domain, and the block it picks is whichever one it finds -- on a box where the
# real vhost cannot be enabled yet (its config references a certificate that
# does not exist), that means certbot grafts TLS onto the DEFAULT site and the
# domain ends up served by the wrong server block. `certbot certonly --webroot`
# obtains the certificate without touching any config at all.
server {
    listen 80;
    server_name PCS_DOMAIN;
    root /var/www/pcs;

    location /.well-known/acme-challenge/ { allow all; }
    location / { return 404; }
}
