# Dashboard shows real position and balance data. It is behind basic auth and
# TLS; do not remove either. certbot rewrites the TLS block on first run.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name PCS_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/PCS_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PCS_DOMAIN/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /var/www/pcs;
    index index.html;

    auth_basic           "put credit spread agent";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # The page is rewritten every 15 minutes; never let a proxy hold it.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }
}
