# managed-by: pcs-bootstrap -- put credit spread agent. Edits here are overwritten.
# Dashboard shows real position and balance data. It is behind a login and TLS;
# do not remove either. certbot rewrites the TLS block on first run.
#
# Authorisation is an `auth_request` subrequest to pcs-authd on loopback, not
# `auth_basic`. The reason is not taste: auth_basic must send a
# `WWW-Authenticate` header, that header is what summons the browser's own
# credential dialog, and that dialog is browser chrome -- no CSS reaches it and
# nginx cannot suppress the header. A styled login page requires a form, and a
# form requires something that can verify a password and issue a session.
#
# Both blocks name PCS_DOMAIN explicitly rather than using a catch-all. This box
# may already serve other sites: `server_name _` would make this the default
# vhost and swallow every request that does not match a more specific name,
# quietly breaking whatever was there first.
server {
    listen 80;
    server_name PCS_DOMAIN;

    # Renewal re-runs the webroot challenge over plain HTTP. A blanket redirect
    # here works fine for 90 days and then silently stops the certificate from
    # renewing, so this location has to come first.
    location /.well-known/acme-challenge/ { root /var/www/pcs; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` was deprecated in nginx 1.25.1 in favour of a separate
    # directive. Kept current deliberately: a deploy that prints warnings trains
    # you to skim past the output, which is where the real problems hide.
    listen 443 ssl;
    http2 on;
    server_name PCS_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/PCS_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PCS_DOMAIN/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /var/www/pcs;
    index index.html;

    auth_request /_auth;
    # Carried onto the main request so the access log records WHO read the
    # account, not merely that someone did.
    auth_request_set $pcs_user $upstream_http_x_pcs_user;

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8765/_auth;
        proxy_pass_request_body off;          # the subrequest only needs the cookie
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # An unauthenticated request lands on the login page rather than a dead end,
    # and returns to where it was going. `$uri` and not `$request_uri`: the
    # latter carries the query string, whose `?` and `&` would be re-parsed as
    # part of the login URL's own query.
    error_page 401 = @login;
    location @login { return 302 /login?next=$uri; }

    # If pcs-authd is down, every request 500s through auth_request. Say so in
    # words rather than serving nginx's blank default.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { auth_request off; internal; }

    location = /login {
        auth_request off;
        # A login form is the one endpoint an attacker can hammer. The verify
        # is a deliberately slow PBKDF2, so this cap is about connection count,
        # not about making guessing expensive -- that part is already true.
        limit_req zone=pcslogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Changes one allowlisted setting. Behind auth_request like everything
    # else, and rate limited: it writes a file the agent reads.
    location = /settings {
        limit_req zone=pcslogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765/settings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /logout {
        auth_request off;
        proxy_pass http://127.0.0.1:8765/logout;
        proxy_set_header Host $host;
    }

    # The page is rewritten every 15 minutes; never let a proxy hold it.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }
}
